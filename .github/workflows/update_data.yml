name: Update JPX Statistics Data

on:
  # 毎月7日の午前3時（UTC+9 = JST）に実行
  # GitHub Actionsは UTC を使用するため、JSTの午前3時 = UTC の前日18時
  schedule:
    - cron: '0 18 6 * *'  # 毎月6日18時 UTC（7日午前3時 JST）
  
  # 手動トリガー用
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴を取得（差分検出用）
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl
      
      - name: Run scraper
        run: python scripts/scraper.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/data/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Configure git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "JPX Data Bot"
          git config --global user.email "bot@jpx-stats.local"
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add public/data/*.json
          git commit -m "chore: update JPX statistics data $(date +'%Y-%m-%d')"
          git push origin main
      
      - name: Notify - No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "No data changes detected. Skipping commit."
      
      - name: Create run summary
        run: |
          echo "## JPX Data Update" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            echo "- Status: ✅ Data updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: ℹ️ No changes" >> $GITHUB_STEP_SUMMARY
          fi
